<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tes Kamera</title>
</head>
<body>
    <h2>Tes Kamera HP</h2>

    <p id="status">Memeriksa dukungan kamera...</p>

    <video id="kamera" autoplay playsinline muted
        style="width:100%; max-width:400px; background:#222;">
    </video>

    <button onclick="tesKamera()">Aktifkan Kamera</button>

    <script>
    async function tesKamera() {
        const status = document.getElementById("status");
        const video = document.getElementById("kamera");

        status.textContent =
            "HTTPS: " + window.isSecureContext +
            " | API kamera: " +
            !!(navigator.mediaDevices &&
               navigator.mediaDevices.getUserMedia);

        if (!navigator.mediaDevices?.getUserMedia) {
            status.textContent +=
                " | Browser ini tidak menyediakan akses kamera.";
            return;
        }

        try {
            const stream =
                await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

            video.srcObject = stream;
            await video.play();

            status.textContent = "Kamera berhasil dibuka!";
        } catch (error) {
            status.textContent =
                "Kesalahan: " + error.name + " — " + error.message;
        }
    }
    </script>
</body>
</html>
